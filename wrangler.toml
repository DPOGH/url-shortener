# wrangler.toml
name = 'url-shortener'
compatibility_date = "2024-07-12"

main = "dist/_worker.js"

# HOTFIX: keep workers_dev enabled until Access is scoped only to the
# custom hostname (otherwise the Access authorized callback can 404).
# After Access is custom-host only, set workers_dev = false.
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "KV"
id = "028b8fbf405f440f8910dfcc0612483b"

# Optional secrets / vars — set in the Cloudflare dashboard (Worker runtime),
# not as Build variables:
# - ALERT_WEBHOOK_URL
# - SUPERADMIN_EMAILS (comma-separated bootstrap superadmin emails)
#
# Do not commit real mailbox addresses here. If you temporarily need a
# local override, use `.dev.vars` (gitignored).


[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
