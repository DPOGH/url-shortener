# wrangler.toml
name = 'url-shortener'
compatibility_date = "2024-07-12"

main = "dist/_worker.js"

# Only the custom domain (toias.link) should expose this Worker.
# Disable Cloudflare's public workers.dev and version-preview hostnames.
workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "KV"
id = "028b8fbf405f440f8910dfcc0612483b"

# Optional error-alert webhook (Teams/Slack incoming webhook URL).
# Set in the Cloudflare dashboard as a secret/environment variable named
# ALERT_WEBHOOK_URL, or with: wrangler secret put ALERT_WEBHOOK_URL
# [vars]
# ALERT_WEBHOOK_URL = ""

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
