# wrangler.toml
name = 'url-shortener'
compatibility_date = "2024-07-12"

main = "dist/_worker.js"

# Keep workers_dev enabled until Cloudflare Access is scoped only to your
# custom hostname (otherwise the Access authorized callback can 404).
# Preview URLs stay disabled.
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "KV"
# Replace this placeholder with your KV namespace id:
#   npx wrangler kv namespace create URL_SHORTENER
id = "00000000000000000000000000000000"

# Do not commit real mailbox addresses or secrets.
# Set these in the Cloudflare dashboard as Worker *runtime* Variables/Secrets
# (Settings → Variables and Secrets — not Build variables):
# - SUPERADMIN_EMAILS  (plain Variable, comma-separated emails)
# - ALERT_WEBHOOK_URL  (Secret, optional)
#
# Optional brand vars. Leave them unset for the anonymous template
# (LOGO badge, home link /admin/, build stamp from src/version.ts):
# - BRAND_MARK                 "badge" or "image"
# - BRAND_ALT
# - BRAND_ARIA_LABEL
# - BRAND_HOME_URL             path (/admin/) or http(s) URL
# - BRAND_HOME_LABEL
# - BRAND_REDIRECT_HINT        text before the final period
# - BRAND_EMAIL_PLACEHOLDER
# - LINKCHECK_USER_AGENT
# - ERROR_LABEL
# - BUILD_VERSION              YYYY-MM-DD_NNN

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
