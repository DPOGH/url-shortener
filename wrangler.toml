# wrangler.toml
name = 'toias-link-url-shortener'
compatibility_date = "2024-07-12"

main = "dist/_worker.js"

# workers.dev stays enabled because Cloudflare Access completes login at
# toias-link-url-shortener.it-5e9.workers.dev/cdn-cgi/access/authorized. With
# workers_dev=false that callback 404s and admin login breaks.
# That hostname is reachable only through Access. Preview URLs stay disabled.
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "KV"
id = "028b8fbf405f440f8910dfcc0612483b"

# Optional secrets (prefer Cloudflare dashboard for production):
# - ALERT_WEBHOOK_URL: Teams/Slack incoming webhook for unhandled errors
#
# Runtime Worker vars (not Build variables — those do not reach c.env):
[vars]
SUPERADMIN_EMAILS = "dario.porru@iasociety.org"


[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
