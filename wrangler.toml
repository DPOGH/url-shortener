# wrangler.toml
name = 'url-shortener'
compatibility_date = "2024-07-12"

main = "dist/_worker.js"

# HOTFIX: workers.dev must stay enabled until Cloudflare Access completes
# login on toias.link only. Access currently finishes at
# url-shortener.it-5e9.workers.dev/cdn-cgi/access/authorized; with
# workers_dev=false that callback 404s and admin login breaks.
# After Access Application domain is only toias.link, set workers_dev=false
# again. Preview URLs stay disabled.
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "KV"
id = "028b8fbf405f440f8910dfcc0612483b"

# Optional secrets / vars (prefer Cloudflare dashboard for production):
# - ALERT_WEBHOOK_URL: Teams/Slack incoming webhook for unhandled errors
# - SUPERADMIN_EMAILS: comma-separated Access emails that may manage any link
# Example:
# [vars]
# SUPERADMIN_EMAILS = "dario.porru@iasociety.org"


[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
